[package]
name = "layerfs-project"
description = "Namespace construction and Store Init/seal/install composition."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerfs-content = { path = "../../../core/crates/layerfs-content" }
layerfs-storage = { path = "../../../core/crates/layerfs-storage" }
layerfs-history = { path = "../../../core/crates/layerfs-history", default-features = false }
layerfs-telemetry = { path = "../../../core/crates/layerfs-telemetry" }

layerfs-persistence = { path = "../layerfs-persistence" }
layerfs-bridge = { path = "../layerfs-bridge" }

[features]
# Init into a PostgreSQL Store (#533 step 10b). Off by default; it adds no
# driver here, only Persistence's PostgreSQL engine.
postgresql = ["layerfs-persistence/postgresql"]

[dev-dependencies]
sha2 = "=0.11.0"
# Only the `postgresql` feature's tests use it directly (schema cleanup).
postgres = "=0.19.14"
