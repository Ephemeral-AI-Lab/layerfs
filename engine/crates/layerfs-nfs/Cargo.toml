[package]
name = "layerfs-nfs"
description = "Loopback NFSv3 service of one mounted Workspace over the kernel request ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerfs-content = { path = "../../../core/crates/layerfs-content" }
layerfs-overlay = { path = "../layerfs-overlay" }
layerfs-vfs = { path = "../layerfs-vfs" }
[dev-dependencies]
layerfs-protocol = { path = "../layerfs-protocol" }
layerfs-daemon = { path = "../layerfs-daemon" }
layerfs-history = { path = "../../../core/crates/layerfs-history" }
layerfs-persistence = { path = "../layerfs-persistence" }
layerfs-project = { path = "../layerfs-project" }
layerfs-storage = { path = "../../../core/crates/layerfs-storage" }
layerfs-telemetry = { path = "../../../core/crates/layerfs-telemetry" }
libc = "=0.2.189"
layerfs-store-service = { path = "../layerfs-store-service" }

[[test]]
name = "helper_deadline"
path = "tests/standalone/helper_deadline.rs"

[[test]]
name = "write"
path = "tests/standalone/write.rs"
