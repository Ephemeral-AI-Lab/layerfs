[package]
name = "layerfs-overlay"
description = "Daemon-owned disposable SQLite overlay, indexed state and bounded jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3 = { version = "=1.8.5", default-features = false }
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }
rusqlite = { version = "=0.40.2", features = ["cache", "limits", "blob"] }

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows has no system SQLite, and the audited identity module needs the
# Win32 file-information calls; CreateFileW is additionally gated on
# Win32_Security by its SECURITY_ATTRIBUTES parameter. windows-sys is
# already in the locked graph.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
