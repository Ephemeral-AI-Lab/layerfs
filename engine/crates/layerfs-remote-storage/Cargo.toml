[package]
name = "layerfs-remote-storage"
description = "Whole-file remote storage drivers (local folder, S3 API, MinIO): upload, ranged download, stat and delete, each request attempted once, with pieces and a sha256 manifest for files larger than a provider holds. Knows nothing about Stores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["local_folder", "minio"]
# A folder on the local filesystem, for tests.
local_folder = []
# The shared S3 API client: one-attempt SigV4 over plain HTTP/1.1, multipart.
s3_api = []
# The MinIO provider over the S3 API.
minio = ["s3_api"]

[dependencies]
sha2 = "=0.11.0"
