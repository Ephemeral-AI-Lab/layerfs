[package]
name = "layerfs-store-service"
description = "The Store engine: typed reads, file changes and Branch history over the global Store, the operator Store calls, and the Store and overlay ports Workspace Commits use. No SDK method names, FUSE, socket or Sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerfs-overlay = { path = "../layerfs-overlay" }
layerfs-workspace = { path = "../layerfs-workspace" }
layerfs-bridge = { path = "../layerfs-bridge" }
layerfs-content = { path = "../../../core/crates/layerfs-content" }
layerfs-storage = { path = "../../../core/crates/layerfs-storage" }
layerfs-history = { path = "../../../core/crates/layerfs-history" }
layerfs-telemetry = { path = "../../../core/crates/layerfs-telemetry" }
# Concrete Store opening (bootstrap) and the kernel guard's open.
layerfs-persistence = { path = "../layerfs-persistence" }
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }
