[package]
name = "layerfs-store-service"
description = "The Store engine: typed reads, file changes and Branch history over the global Store, the SDK Store-call facade (methods/), the operator Store calls, and the Store and overlay ports Workspace Commits use. read, write and history know no SDK method names; methods/ is the SDK facade. No FUSE, socket or Sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# PostgreSQL Store engine (#506), off by default.
postgresql = ["layerfs-persistence/postgresql", "dep:postgres"]

[dependencies]
layerfs-overlay = { path = "../layerfs-overlay" }
layerfs-workspace = { path = "../layerfs-workspace" }
layerfs-bridge = { path = "../layerfs-bridge" }
layerfs-content = { path = "../../../core/crates/layerfs-content" }
layerfs-storage = { path = "../../../core/crates/layerfs-storage" }
layerfs-history = { path = "../../../core/crates/layerfs-history" }
layerfs-telemetry = { path = "../../../core/crates/layerfs-telemetry" }
# Concrete Store opening (bootstrap) and the kernel guard's open.
layerfs-persistence = { path = "../layerfs-persistence" }
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }
# Only the `postgresql` feature's tests use it directly (schema cleanup).
postgres = { version = "=0.19.14", optional = true }

[dev-dependencies]
# The method-table tests (#536 step 1.1) Init their Store through Project,
# count its rows and time BLAKE3 over the bytes they write.
layerfs-project = { path = "../layerfs-project" }
rusqlite = { version = "=0.40.2", features = ["cache", "limits", "blob"] }
blake3 = { version = "=1.8.5", default-features = false }
