[package]
name = "layerfs-persistence"
description = "Shared physical persistence and history over embedded SQLite or PostgreSQL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerfs-storage = { path = "../../../core/crates/layerfs-storage" }
layerfs-history = { path = "../../../core/crates/layerfs-history", default-features = false }
layerfs-content = { path = "../../../core/crates/layerfs-content" }
layerfs-telemetry = { path = "../../../core/crates/layerfs-telemetry" }
rusqlite = { version = "=0.40.2", features = ["cache", "limits", "blob"] }

# PostgreSQL Store engine (#506), off by default. Owner-authorized new
# dependencies for this issue: the sync `postgres` client (pinned as in the
# #420 experiments) and one TLS connector.
postgres = { version = "=0.19.14", optional = true }
postgres-native-tls = { version = "=0.5.3", optional = true }
native-tls = { version = "=0.2.18", optional = true }

[features]
postgresql = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls"]

[dev-dependencies]
blake3 = { version = "=1.8.5", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs", "pthread", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
