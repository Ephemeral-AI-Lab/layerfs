[package]
name = "layerfs-persistence"
description = "Shared physical persistence and history over durable embedded SQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerfs-storage = { path = "../../../core/crates/layerfs-storage" }
layerfs-history = { path = "../../../core/crates/layerfs-history", default-features = false }
layerfs-content = { path = "../../../core/crates/layerfs-content" }
layerfs-telemetry = { path = "../../../core/crates/layerfs-telemetry" }
rusqlite = { version = "=0.40.2", features = ["cache", "limits", "blob"] }
# The lane name digest; the same locked sha2 layerfs-storage already uses.
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
blake3 = { version = "=1.8.5", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs", "pthread", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows has no system SQLite; the Store bundles the same version. The
# writer lane and volume probe FFI use windows-sys, already in the locked graph.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
