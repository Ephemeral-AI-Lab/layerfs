[package]
name = "layerfs-api"
description = "The SDK's public surface behind the JavaScript SDK, one function per method: project Init and Branches, fs and branch Store methods over layerfs-store-service, and Sandbox control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerfs-bridge = { path = "../layerfs-bridge" }
layerfs-content = { path = "../../../core/crates/layerfs-content" }
layerfs-history = { path = "../../../core/crates/layerfs-history" }
layerfs-persistence = { path = "../layerfs-persistence" }
layerfs-storage = { path = "../../../core/crates/layerfs-storage" }
layerfs-telemetry = { path = "../../../core/crates/layerfs-telemetry" }
layerfs-project = { path = "../layerfs-project" }
layerfs-sandbox = { path = "../layerfs-sandbox" }
layerfs-store-service = { path = "../layerfs-store-service" }
libc = "=0.2.189"
nix = { version = "=0.31.3", default-features = false, features = ["fs", "user", "signal"] }

[features]
# PostgreSQL Stores (#506): open, import and attach. Off by default; the
# sealed Linux build the worker runs turns it on.
postgresql = ["layerfs-persistence/postgresql", "layerfs-store-service/postgresql"]
# https:// remotes: Cloudflare R2, MinIO behind TLS. Off by default; the
# sealed Linux build the worker runs turns it on.
tls = ["layerfs-store-service/tls"]

[dev-dependencies]
nix = { version = "=0.31.3", features = ["fs", "user", "process"] }
layerfs-daemon = { path = "../layerfs-daemon" }
layerfs-fuse = { path = "../layerfs-fuse" }
# #364: the write-cost harness times BLAKE3 over the bytes it writes.
blake3 = { version = "=1.8.5", default-features = false }
# The Store method tests bind private Workspaces and count the Store's rows.
layerfs-overlay = { path = "../layerfs-overlay" }
layerfs-workspace = { path = "../layerfs-workspace" }
rusqlite = { version = "=0.40.2", features = ["cache", "limits", "blob"] }
