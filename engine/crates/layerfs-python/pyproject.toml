[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "layerfs"
version = "1.1.0"
description = "Python SDK for LayerFS (local preparation; not published)"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

[tool.maturin]
module-name = "layerfs._native"
python-source = "python"
features = ["pyo3/extension-module"]
compatibility = "linux"
