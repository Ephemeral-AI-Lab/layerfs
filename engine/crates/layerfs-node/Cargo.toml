[package]
name = "layerfs-node"
description = "Node front end of the layerfs package: the library's one call and its call table (#533)"
publish = false
workspace = "../../.."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# PostgreSQL Stores (#506). Off by default.
postgresql = ["layerfs-api/postgresql"]
# https:// buckets: Cloudflare R2, MinIO behind TLS. Off by default.
tls = ["layerfs-api/tls"]

[dependencies]
layerfs-api = { path = "../layerfs-api", features = ["machine"] }
layerfs-bridge = { path = "../layerfs-bridge" }
napi = { version = "=2.16.17", features = ["napi4"] }
napi-derive = "=2.16.13"

[build-dependencies]
napi-build = "=2.1.6"
