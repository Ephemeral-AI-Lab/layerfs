[package]
name = "layerfs-node"
description = "Node binding for the LayerFS JavaScript SDK: Store calls in-process (layerfs-store-service), Sandbox calls over layerfs-api"
publish = false
workspace = "../../.."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
layerfs-project = { path = "../layerfs-project" }
layerfs-api = { path = "../layerfs-api" }
layerfs-bridge = { path = "../layerfs-bridge" }
layerfs-history = { path = "../../../core/crates/layerfs-history" }
layerfs-persistence = { path = "../layerfs-persistence" }
layerfs-sandbox = { path = "../layerfs-sandbox" }
layerfs-storage = { path = "../../../core/crates/layerfs-storage" }
layerfs-store-service = { path = "../layerfs-store-service" }
layerfs-telemetry = { path = "../../../core/crates/layerfs-telemetry" }
napi = "=2.16.17"
napi-derive = "=2.16.13"

[build-dependencies]
napi-build = "=2.1.6"

[target.'cfg(target_os = "windows")'.dependencies]
# The discovery guard's mutex-name digest (K3 F1), the locked sha2.
sha2 = { version = "=0.11.0", default-features = false }
# The Windows discovery guard's named kernel mutex; already in the locked graph.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
