[package]
name = "layerfs-cluster2-platform-proof"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
fuser = { version = "=0.18.0", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled", "blob"] }
layerfs-content = { path = "../../crates/layerfs-content" }
nix = { version = "=0.31.3", features = ["fs", "mount", "user"] }

[[bin]]
name = "platform-proof"
path = "platform.rs"

[[bin]]
name = "timestamp-proof"
path = "timestamp.rs"

# Owner-authorized signed-timestamp correction to the crates.io 0.18.0 archive.
[patch.crates-io]
fuser = { version = "=0.18.0", path = "../../vendor/fuser-0.18.0" }

[[bin]]
name = "request-time-proof"
path = "request-time.rs"

[[bin]]
name = "session-lifecycle-proof"
path = "session-lifecycle.rs"
