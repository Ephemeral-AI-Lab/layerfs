[package]
name="layerfs-server"
description="Authorized local C1/C2 composition, Server assembly and native service"
version.workspace=true
edition.workspace=true
rust-version.workspace=true
license.workspace=true
[dependencies]
layerfs-api-core={path="../layerfs-api/core"}
layerfs-bridge={path="../layerfs-bridge"}
layerfs-content={path="../layerfs-content"}
layerfs-history={path="../layerfs-history"}
layerfs-sandbox={path="../layerfs-sandbox"}
layerfs-storage={path="../layerfs-storage"}
layerfs-telemetry={path="../layerfs-telemetry",features=["native"]}
nix = { version = "=0.31.3", features = ["poll"] }

[dev-dependencies]
sha2 = "=0.10.9"
