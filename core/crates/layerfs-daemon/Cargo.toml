[package]
name="layerfs-daemon"
description="Native bridge and Linux Workspace mount assembly"
version.workspace=true
edition.workspace=true
rust-version.workspace=true
license.workspace=true
[dependencies]
layerfs-bridge={path="../layerfs-bridge"}
layerfs-telemetry={path="../layerfs-telemetry",features=["native"]}
