[package]
name = "layerfs-project"
description = "Engine-independent namespace initialization over C1/C2/C5."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerfs-content = { path = "../layerfs-content" }
layerfs-storage = { path = "../layerfs-storage" }
layerfs-history = { path = "../layerfs-history", default-features = false }
layerfs-telemetry = { path = "../layerfs-telemetry" }

[target.'cfg(target_os = "windows")'.dependencies]
# The audited host-identity probe; CreateFileW is additionally gated on
# Win32_Security by its SECURITY_ATTRIBUTES parameter. windows-sys is
# already in the locked graph.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
layerfs-persistence = { path = "../layerfs-persistence" }
sha2 = "=0.11.0"
