[package]
name = "layerfs-bridge"
description = "Authenticated bounded native channels for cluster-two runtime integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["native"]
native = ["dep:snow"]

[dependencies]
snow = { version = "=0.9.6", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(chacha20_force_neon)',
    'cfg(aes_armv8)',
    'cfg(polyval_armv8)',
] }
