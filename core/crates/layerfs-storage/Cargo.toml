[package]
name = "layerfs-storage"
description = "Content-addressed physical storage: encoding, packs and bounded persistence ports (C2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sha2 = "=0.11.0"
blake3 = { version = "=1.8.5", default-features = false }
layerfs-content = { path = "../layerfs-content" }
layerfs-telemetry = { path = "../layerfs-telemetry" }
zstd-sys = { version = "=2.0.16", default-features = false, features = ["experimental"] }
