[package]
name = "layerfs-overlay"
description = "Daemon-owned disposable SQLite overlay, indexed state and bounded jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }
rusqlite = { version = "=0.40.2", features = ["cache", "limits", "blob"] }

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
