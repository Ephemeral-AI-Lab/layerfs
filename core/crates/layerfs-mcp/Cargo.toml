[package]
name = "layerfs-mcp"
description = "MCP stdio server exposing LayerFS Store tools to peri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "layerfs-mcp"
path = "src/main.rs"

[dependencies]
layerfs-api = { path = "../layerfs-api" }
layerfs-bridge = { path = "../layerfs-bridge" }
layerfs-history = { path = "../layerfs-history" }
layerfs-persistence = { path = "../layerfs-persistence" }
layerfs-storage = { path = "../layerfs-storage" }
layerfs-store-service = { path = "../layerfs-store-service" }
layerfs-telemetry = { path = "../layerfs-telemetry" }
libc = "0.2"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "io-std", "process", "time"] }
