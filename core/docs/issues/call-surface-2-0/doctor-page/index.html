<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerFS Doctor (mock)</title>
<style>
/* Mock of the dsh-layerfs Doctor page: the visual and behavioural specification
   for the React port. Tokens named --dsw-* are the DSH alias tokens the plugin's
   stylesheets use, with the values of the DSH light and dark themes.
   Tokens named --doc-* are this page's own. They exist because three DSH pairs
   fail contrast: success and warn on a white card (2.3:1 and 2.1:1), and white
   on the dark theme's primary blue (2.3:1). The port either takes these values
   or checks that the real StateDot, Button and HoverCard pass. */
:root {
  --dsw-alias-label-primary: #0f1115;
  --dsw-alias-label-secondary: #61666b;
  --dsw-alias-border-l2: #0000001a;
  --dsw-alias-border-l3: #0000001f;
  --dsw-alias-border-l4: #00000029;
  --dsw-alias-bg-base: #ffffff;
  --dsw-alias-bg-layer-2: #ffffff;
  --dsw-alias-bg-module-platform: #f5f6f7;
  --dsw-alias-settings-card-fill: var(--dsw-alias-bg-layer-2);
  --dsw-alias-settings-card-stroke: var(--dsw-alias-border-l4);
  --dsw-alias-interactive-bg-hover: #2631480f;
  --dsw-alias-interactive-bg-active: #2631481a;
  --dsw-radius-xs: 4px;
  --dsw-radius-sm: 8px;
  --dsw-radius-md: 12px;
  --dsw-radius-lg: 16px;
  --dsw-radius-xl: 20px;
  --dsw-elevation-panel: 0 0 0 .5px var(--dsw-alias-border-l4), 0 3px 8px 0 #00000014, 0 0 16px 0 #0000000a;
  --dsw-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ds-font-family-code: "SF Mono", "JetBrains Mono", "Fira Code", Consolas, "Liberation Mono", Menlo, Courier, monospace;
  --lfs-light: #93b1e0;
  --lfs-dark: color-mix(in oklab, #2f5bb5 82%, var(--dsw-alias-label-primary));
  /* state marks: at least 3:1 on the card, the hovered row and the detail panel */
  --doc-ok: #15803d;
  --doc-bad: #d41414;
  --doc-warn: #b45309;
  --doc-hollow: #73787f;
  --doc-run: #3767d6;
  --doc-link: #2f5fcf;
  --doc-primary-bg: #3767d6;
  --doc-primary-fg: #ffffff;
  /* the tip has its own surface, never the card's */
  --doc-tip-bg: #26282d;
  --doc-tip-fg: #f9fafb;
  --doc-tip-fg-2: #cfd3d6;
  --doc-tip-well: #121316;
  --doc-tip-ok: #4ade80;
  --doc-tip-bad: #ff7b7b;
  --doc-tip-warn: #fbbf24;
  --doc-tip-hollow: #b6bbc1;
  color-scheme: light;
}
:root[data-theme='dark'] {
  --dsw-alias-label-primary: #f9fafb;
  --dsw-alias-label-secondary: #cfd3d6;
  --dsw-alias-border-l2: #ffffff1f;
  --dsw-alias-border-l3: #ffffff29;
  --dsw-alias-border-l4: #ffffff33;
  --dsw-alias-bg-base: #151517;
  --dsw-alias-bg-layer-2: #2c2c2e;
  --dsw-alias-bg-module-platform: #353638;
  --dsw-alias-interactive-bg-hover: #ffffff14;
  --dsw-alias-interactive-bg-active: #ffffff24;
  --dsw-elevation-panel: 0 0 0 .5px var(--dsw-alias-border-l3), 0 3px 8px 0 #00000040, 0 0 16px 0 #00000026;
  --doc-ok: #22c55e;
  --doc-bad: #f76a6a;
  --doc-warn: #f5a524;
  --doc-hollow: #adb2b8;
  --doc-run: #7aaaff;
  --doc-link: #8fb8ff;
  --doc-primary-bg: #7aaaff;
  --doc-primary-fg: #0f1115;
  --doc-tip-bg: #4a4b50;
  --doc-tip-fg: #f9fafb;
  --doc-tip-fg-2: #dadde0;
  --doc-tip-well: #2a2b2e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary);
  font: 13px/20px var(--dsw-font-family);
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--ds-font-family-code); font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--doc-run); outline-offset: 1px; }

/* ---------- page (ui.module.css .page / .column / .head) ---------- */
.page { --inset: clamp(24px, 4vw, 48px); }
.column {
  display: flex; flex-direction: column; gap: 20px;
  width: 100%; max-width: calc(960px + 2 * var(--inset));
  margin: 0 auto; padding: 0 var(--inset) 32px;
}
.head { display: flex; flex-direction: column; gap: 14px; padding-top: 28px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); }
.headRow { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 16px; }
.title { margin: 0; font-size: 20px; font-weight: 500; line-height: 28px; }
.intro { margin: 4px 0 0; color: var(--dsw-alias-label-secondary); font-variant-numeric: tabular-nums; min-height: 20px; }
.source { margin: -8px 4px 0; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); }

/* ---------- buttons (DSH Button: primary, outline; size sm) ----------
   A button that cannot be pressed keeps aria-disabled, not disabled: it stays
   in the tab order, keeps focus and says why in its tip. */
.btn {
  position: relative; display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 6px;
  height: 28px; padding: 0 10px;
  border: 0.5px solid var(--dsw-alias-border-l4); border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-bg-layer-2);
  font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap; cursor: pointer;
  transition: background-color 120ms ease, opacity 120ms ease;
}
.btn[data-variant='primary'] { border-color: transparent; background: var(--doc-primary-bg); color: var(--doc-primary-fg); }
.btn[data-size='lg'] { height: 32px; min-width: 96px; padding: 0 14px; }
.btn[data-w='check'] { width: 58px; padding: 0; }
.btn[data-w='full'] { width: 88px; padding: 0; }
.btn[data-w='copy'] { width: 64px; padding: 0; }
.btn[aria-disabled='true'] { cursor: default; }
.btn[aria-disabled='true']:not([aria-busy='true']) { opacity: 0.5; }
.btn[aria-busy='true'] { color: transparent; }
.btn[aria-busy='true']::after {
  content: ''; position: absolute; inset: 0; margin: auto; width: 12px; height: 12px; border-radius: 50%;
  border: 1.5px solid var(--doc-run); border-right-color: transparent;
  animation: spin 900ms linear infinite;
}
.btn[data-variant='primary'][aria-busy='true']::after { border-color: var(--doc-primary-fg); border-right-color: transparent; }
.btn:active:not([aria-disabled='true']) { background: var(--dsw-alias-interactive-bg-active); }
.btn[data-variant='primary']:active:not([aria-disabled='true']) { background: var(--doc-primary-bg); filter: brightness(0.86); }
@media (hover: hover) {
  .btn:hover:not([aria-disabled='true']) { background: var(--dsw-alias-interactive-bg-hover); }
  .btn[data-variant='primary']:hover:not([aria-disabled='true']) { background: var(--doc-primary-bg); filter: brightness(0.93); }
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- marks: one shape per result, so colour is never the only carrier ----------
   ok = filled disc, bad = cross, warn = diamond, nc = hollow ring (the one hollow
   style), run = spinner. .dot is the 14px signal slot; a bare .mk is a check mark. */
.mk { display: inline-block; flex: none; width: var(--sz, 7px); height: var(--sz, 7px); }
.mk[data-s='ok'] { border-radius: 50%; background: var(--doc-ok); }
.mk[data-s='nc'] { border-radius: 50%; border: 1.5px solid var(--doc-hollow); }
.mk[data-s='warn'] { border-radius: 1px; background: var(--doc-warn); transform: rotate(45deg) scale(0.88); }
.mk[data-s='bad'] {
  background:
    linear-gradient(var(--doc-bad), var(--doc-bad)) center / 100% 2px no-repeat,
    linear-gradient(var(--doc-bad), var(--doc-bad)) center / 2px 100% no-repeat;
  transform: rotate(45deg) scale(1.25);
}
.mk[data-s='run'] {
  border-radius: 50%; border: 1.5px solid var(--doc-run); border-right-color: transparent;
  animation: spin 900ms linear infinite; animation-delay: var(--spin-delay, 0ms);
}
.dot { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 14px; height: 14px; --sz: 9px; }
.dot .mk[data-s='run'] { --sz: 11px; }

/* ---------- signal: the dot and its status word, one focusable thing with a tip ---------- */
.sig {
  display: inline-flex; flex: none; align-items: center; gap: 5px;
  height: 24px; padding: 0 6px 0 3px; border: 0; border-radius: 6px; background: none;
  white-space: nowrap; cursor: default;
}
.sig[data-st='problem'], .sig[data-st='notice'] { font-weight: 500; }
.line > .sig { min-width: 98px; }   /* the width of the longest status word, so what follows lines up */
.title .sig { height: 28px; gap: 8px; padding: 0 6px 0 0; font-size: 20px; font-weight: 500; line-height: 28px; font-variant-numeric: tabular-nums; }
@media (hover: hover) { .sig:hover { background: var(--dsw-alias-interactive-bg-hover); } }

/* ---------- this install ---------- */
.homeBox { padding: 2px 0; border: 0.5px solid var(--dsw-alias-border-l3); border-radius: var(--dsw-radius-lg); background: var(--dsw-alias-bg-layer-2); }

/* ---------- tabs (storage HomeHero .tabBar / .tab) ---------- */
.tabBar {
  position: sticky; top: 0; z-index: 5;
  margin: 0 -4px;
  border-bottom: 0.5px solid var(--dsw-alias-border-l2);
  background: var(--dsw-alias-bg-base);
}
/* the bar scrolls sideways when the tabs do not fit; a fade marks each edge that cuts tabs off */
.tabScroll {
  padding: 0 4px;
  overflow-x: auto; scrollbar-width: none;
  --fl: 0px; --fr: 0px;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
}
.tabScroll::-webkit-scrollbar { display: none; }
.tabScroll[data-fade-l] { --fl: 28px; }
.tabScroll[data-fade-r] { --fr: 28px; }
.tabs { display: flex; gap: 4px; width: max-content; }
.tab {
  position: relative; display: inline-flex; flex: none; align-items: center; gap: 7px;
  height: 40px; padding: 0 10px 0 12px; border: 0; background: none;
  font-size: 13.5px; color: var(--dsw-alias-label-secondary); cursor: pointer;
}
.tab[aria-selected='true'] { color: var(--dsw-alias-label-primary); }
.tab[aria-selected='true']::after {
  content: ''; position: absolute; left: 8px; right: 8px; bottom: -0.5px; height: 2px;
  border-radius: 1px; background: var(--doc-run);
}
/* the label keeps the bold width whether or not it is selected, so selecting never shifts the bar */
.tabLabel { display: inline-grid; }
.tabLabel::after { content: attr(data-text); grid-area: 1 / 1; height: 0; visibility: hidden; font-weight: 500; }
.tabLabel > span { grid-area: 1 / 1; }
.tab[aria-selected='true'] .tabLabel > span { font-weight: 500; }
.tab:focus-visible { outline-offset: -4px; border-radius: 6px; }
.tabCount { font-size: 12px; font-weight: 400; color: var(--dsw-alias-label-secondary); font-variant-numeric: tabular-nums; }
.tab .dot { margin-left: -2px; }   /* the mark's slot is always there, filled or not */
@media (hover: hover) { .tab:hover { color: var(--dsw-alias-label-primary); } }

/* ---------- list card and rows ---------- */
.card {
  min-width: 0; padding: 4px 0;
  border: 0.5px solid var(--dsw-alias-settings-card-stroke); border-radius: var(--dsw-radius-xl);
  background: var(--dsw-alias-settings-card-fill);
}
.group { border-top: 0.5px solid var(--dsw-alias-border-l2); padding: 4px 0; }
.group:first-child { border-top: 0; }
.line {
  --depth: 0;
  display: flex; align-items: center; gap: 2px 8px;
  min-height: 40px; margin: 0 4px; padding: 0 8px 0 2px;
  border-radius: var(--dsw-radius-md); cursor: pointer;
}
.line:not([data-depth='0']) { min-height: 36px; }
.line[data-flash] { box-shadow: inset 0 0 0 2px var(--doc-run); }
@media (hover: hover) { .line:hover { background: var(--dsw-alias-interactive-bg-hover); } }
.rowBtn {
  /* one name column at every depth, so the signals line up */
  display: inline-flex; flex: 0 0 min(264px, 34%); align-items: center; gap: 8px; min-width: 0;
  height: 32px; padding: 0 4px 0 calc(8px + var(--depth) * 24px);
  border: 0; border-radius: var(--dsw-radius-sm); background: none; text-align: left; cursor: pointer;
}
.name { min-width: 0; overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.line:not([data-depth='0']) .name { font-weight: 400; }
.ico { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 16px; height: 16px; color: var(--dsw-alias-label-secondary); }
.ico svg { display: block; }
.tab .ico { color: inherit; }
.chev { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 10px; height: 10px; transition: transform 120ms ease; }
.chev::before { content: ''; width: 5px; height: 5px; border-right: 1.5px solid var(--doc-hollow); border-bottom: 1.5px solid var(--doc-hollow); transform: rotate(-45deg); }
.rowBtn[aria-expanded='true'] .chev { transform: rotate(90deg); }

/* what follows the signal: the finding's own word, the root cause, the fix, then facts */
.more { display: flex; flex: 1 1 0; align-items: center; gap: 8px; min-width: 0; }
.word { flex: 0 1 auto; min-width: 0; overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.fact { flex: 1 1 0; min-width: 0; overflow: hidden; color: var(--dsw-alias-label-secondary); text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.inside { display: inline-flex; flex: none; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.cause {
  display: inline-flex; flex: 0 1 auto; align-items: center; gap: 4px; min-width: 0;
  height: 22px; padding: 0 8px 0 4px;
  border: 0.5px solid var(--dsw-alias-border-l4); border-radius: 999px;
  color: var(--doc-link); font-size: 12px; text-decoration: none; white-space: nowrap;
}
.cause span.n { overflow: hidden; text-overflow: ellipsis; }
@media (hover: hover) { .cause:hover span.n { text-decoration: underline; } }
.phase { flex: none; color: var(--dsw-alias-label-secondary); white-space: nowrap; }
.live { display: inline-flex; flex: none; align-items: center; gap: 8px; }
.elapsed { min-width: 34px; color: var(--dsw-alias-label-secondary); font-variant-numeric: tabular-nums; }
.more .btn { height: 26px; }

/* the mark group: one mark per check, one focusable signal. Its width is reserved
   from the number of checks, so nothing beside it moves when the marks land. */
.marks {
  display: inline-flex; flex: none; align-items: center; justify-content: flex-end; gap: 4px;
  height: 24px; min-width: calc(var(--n) * 11px + 4px); padding: 0 4px;
  border: 0; border-radius: 6px; background: none; cursor: default;
}
span.marks { visibility: hidden; }
@media (hover: hover) { button.marks:hover { background: var(--dsw-alias-interactive-bg-hover); } }
/* Full check and Check keep one slot each on every row, so Check and the marks form columns */
.acts { display: flex; flex: none; align-items: center; justify-content: flex-end; gap: 6px; width: 152px; }

/* ---------- a row's detail: the call, the checks, the fix ---------- */
.kids { display: block; }
.detail {
  --depth: 0;
  display: flex; flex-direction: column; gap: 8px;
  margin: 2px 12px 8px calc(36px + var(--depth) * 24px); padding: 10px 12px;
  border-radius: var(--dsw-radius-md); background: var(--dsw-alias-bg-module-platform);
}
.cmdLine { display: flex; align-items: flex-start; gap: 8px; }
.cmdLine code {
  flex: 1 1 0; min-width: 0; padding: 5px 9px; overflow-wrap: anywhere; white-space: pre-wrap;
  border: 0.5px solid var(--dsw-alias-border-l2); border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-bg-layer-2);
}
.cmdLine .lbl { flex: none; width: 34px; padding-top: 4px; font-size: 12px; color: var(--dsw-alias-label-secondary); }
.checks { display: flex; flex-direction: column; gap: 3px; margin: 0; padding: 0 0 0 42px; list-style: none; }
.checks li { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.chk { display: inline-flex; flex: none; align-items: baseline; gap: 8px; margin: 0 0 0 -4px; padding: 0 4px; border: 0; border-radius: 4px; background: none; cursor: default; }
.chk .mk { align-self: center; }
@media (hover: hover) { .chk:hover { background: var(--dsw-alias-interactive-bg-hover); } }
.checks .res { min-width: 0; font-size: 12px; color: var(--dsw-alias-label-secondary); overflow-wrap: anywhere; }

/* ---------- tooltip (storage Signal .body / HoverCard) ---------- */
.tip {
  position: fixed; z-index: 20; display: none; flex-direction: column; gap: 3px;
  min-width: 120px; max-width: min(300px, calc(100vw - 16px)); padding: 8px 10px;
  border-radius: var(--dsw-radius-sm); background: var(--doc-tip-bg); color: var(--doc-tip-fg);
  box-shadow: 0 0 0 .5px #ffffff2e, 0 4px 14px 0 #00000052;
  font-size: 12px; line-height: 16px; overflow-y: auto; overscroll-behavior: contain;
  --doc-ok: var(--doc-tip-ok, #22c55e); --doc-bad: var(--doc-tip-bad, #f76a6a); --doc-warn: var(--doc-tip-warn, #f5a524); --doc-hollow: var(--doc-tip-hollow, #adb2b8);
}
.tip > * { flex-shrink: 0; }
.tip[data-on] { display: flex; }
.tip[data-wide] { max-width: min(440px, calc(100vw - 16px)); }
.tip b { display: flex; align-items: center; gap: 6px; font-weight: 500; overflow-wrap: anywhere; }
.tip span.l { color: var(--doc-tip-fg-2); overflow-wrap: anywhere; }
.tip ul { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 0; padding: 0; list-style: none; }
.tip li { display: flex; align-items: baseline; gap: 7px; }
.tip li .mk { align-self: center; }
.tip li i { font-style: normal; color: var(--doc-tip-fg-2); }
.tip pre {
  margin: 4px 0 0; padding: 6px 8px; border-radius: 6px; background: var(--doc-tip-well);
  font-family: var(--ds-font-family-code); font-size: 11.5px; line-height: 17px; color: var(--doc-tip-fg);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.tip pre i { font-style: normal; color: var(--doc-tip-fg-2); }

/* ---------- toast: also the page's polite live region ---------- */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast {
  max-width: min(420px, calc(100vw - 40px)); padding: 9px 12px;
  border-radius: var(--dsw-radius-md); background: var(--doc-tip-bg); color: var(--doc-tip-fg);
  box-shadow: 0 0 0 .5px #ffffff2e, 0 4px 14px 0 #00000052;
}

/* ---------- MOCK ONLY: the scenario strip. Not part of the page; the port does not carry it. ---------- */
.mock {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  margin: 24px 0 0; padding: 10px 16px 14px;
  border-top: 2px dashed var(--dsw-alias-border-l4);
  background: var(--dsw-alias-bg-module-platform);
  color: var(--dsw-alias-label-secondary); font-size: 12px;
}
.mock b { color: var(--dsw-alias-label-primary); text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }
.mock label { display: inline-flex; align-items: center; gap: 6px; }
.mock select { height: 28px; max-width: 100%; padding: 0 6px; border: 0.5px solid var(--dsw-alias-border-l4); border-radius: var(--dsw-radius-sm); background: var(--dsw-alias-bg-layer-2); color: var(--dsw-alias-label-primary); }
.mock .hint { flex: 1 1 100%; color: var(--dsw-alias-label-secondary); }

/* ---------- phone: name and status word on the first line, the rest below ---------- */
@media (max-width: 860px) {
  .page { --inset: 12px; }
  .line { flex-wrap: wrap; padding: 4px 6px 4px 0; }
  .rowBtn { flex: 1 1 0; gap: 7px; padding-left: calc(6px + var(--depth) * 14px); }
  .line > .sig { order: 1; min-width: 0; }
  .more { order: 2; flex: 1 1 100%; padding-left: calc(31px + var(--depth) * 14px); }
  .more[data-thin] { height: 0; overflow: hidden; }   /* nothing to say: still the line break before the marks */
  .line[data-bare] .more[data-thin] { display: none; }
  .more { flex-wrap: wrap; }
  .fact { flex: 1 1 100%; white-space: normal; overflow-wrap: anywhere; }
  .marks { order: 3; min-width: 0; margin-left: calc(27px + var(--depth) * 14px); }
  .acts { order: 4; width: auto; margin-left: auto; }
  .line[data-bare] .marks, .line[data-bare] .acts { display: none; }
  .detail { margin: 2px 8px 8px calc(12px + var(--depth) * 14px); }
  .checks { padding-left: 0; }
  .checks li { flex-wrap: wrap; gap: 0 8px; }
  .cmdLine { flex-wrap: wrap; }
  .cmdLine .lbl { width: 100%; padding: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .mk[data-s='run'] { animation: none; border-style: dotted; border-right-color: var(--doc-run); }
  .btn[aria-busy='true']::after { animation: none; border-style: dotted; }
  .chev, .btn { transition: none; }
}
</style>
</head>
<body>
<div class="page">
  <div class="column">
    <header class="head">
      <div class="crumbs"><span>LayerFS</span><span aria-hidden="true">›</span><span>Doctor</span></div>
      <div class="headRow">
        <div>
          <h1 class="title"><span class="sr">Doctor: </span><button type="button" class="sig" id="headSig" data-fid="head"></button></h1>
          <p class="intro" id="sub"></p>
        </div>
        <button type="button" class="btn" data-variant="primary" data-size="lg" id="checkAll" data-fid="checkAll">Check all</button>
      </div>

      tip: { title: 'Check', lines: [why || COVERS[x.k]], cmds: [callFor(x)] } }));
  }
  return '<div class="line" data-key="' + esc(key) + '" data-depth="' + v.depth + '" style="--depth:' + v.depth + '"' + (!v.showMarks && !acts.length ? ' data-bare' : '') + (S.flash === key ? ' data-flash' : '') + '>'
    + '<button type="button" class="rowBtn" data-fid="row:' + esc(key) + '" data-act="toggle" data-key="' + esc(key) + '" aria-expanded="' + v.open + '"' + (controls ? ' aria-controls="' + controls + '"' : '') + '>'
    + '<span class="chev" aria-hidden="true"></span><span class="ico">' + kind.svg + '</span><span class="name">' + esc(v.name) + '</span><span class="sr">, ' + esc(said) + '</span></button>'
    + '<button type="button" class="sig" data-st="' + o.st + '"' + tipFor('sig:' + key, sTip) + '>' + dot(DOT[o.st]) + WORD[o.st]
    + (sTip.lines && sTip.lines.length ? '<span class="sr">: ' + esc(sTip.lines.join(' ')) + '</span>' : '') + '</button>'
    + '<span class="more"' + (!more.length ? ' data-thin' : '') + '>' + more.join('') + '</span>'
    + marks + '<span class="acts">' + acts.join('') + '</span></div>';
}
/* Expansion exposes the row’s own report before its children. */
function nodeHtml(x, depth) {
  const v = view(x, depth);
  if (!v.open) return rowHtml(v);
  if (!v.folder) return rowHtml(v) + detailHtml(v);
  return rowHtml(v) + detailHtml(v)
    + '<div class="kids" role="group" id="k' + x.i + '" aria-label="On ' + esc(x.n) + '">' + v.kids.map((y) => nodeHtml(y, depth + 1)).join('') + '</div>';
}

let focusNext = null;      // where focus goes when the focused button left the page
let quietFocus = false;    // a render's own refocus opens no tip
function render() {
  TIPS = {};
  document.documentElement.style.setProperty('--spin-delay', '-' + (Date.now() % 900) + 'ms');
  const active = document.activeElement;
  const focusId = focusNext || (active && active.dataset ? active.dataset.fid : null);
  const keepTip = tipFid;
  focusNext = null; quietFocus = true;
  const things = W.things;
  const states = things.map((x) => stateOf(x));

  /* head: one headline, one line of counts, Check all */
  const c = { ok: 0, notice: 0, problem: 0, run: 0, nc: 0 };
  states.forEach((o) => { c[o.st] += 1; });
  const all = running('all');
  const headline = all ? WORD.run + ' ' + all.done + ' of ' + all.total
    : c.problem ? plural(c.problem, 'problem')
    : c.nc === things.length ? WORD.nc
    : c.notice ? plural(c.notice, 'notice')
    : c.nc || c.run ? 'No problems' : 'All clear';
  const headState = all || c.run ? 'run' : c.problem ? 'bad' : c.nc === things.length ? 'nc' : c.notice ? 'warn' : c.nc ? 'nc' : 'ok';
  const bits = [];
  if (c.ok) bits.push(c.ok + ' OK');
  if (c.notice) bits.push(plural(c.notice, 'notice'));
  if (c.run) bits.push(c.run + ' checking');
  if (c.nc) bits.push(c.nc + ' not checked');
  const headSig = document.getElementById('headSig');
  headSig.innerHTML = dot(headState) + esc(headline);
  TIPS.head = { title: headline, lines: ['Opening this page runs no doctor. The tree is read from records; each thing reads Not checked until a doctor has run.'], cmds: ['layerfs home get --with tree'] };
  document.getElementById('sub').textContent = bits.join(' · ');

  const plan = allPlan(); const allWhy = all ? null : allOffWhy();
  const ca = document.getElementById('checkAll');
  if (all) ca.setAttribute('aria-busy', 'true'); else ca.removeAttribute('aria-busy');
  if (all || allWhy) ca.setAttribute('aria-disabled', 'true'); else ca.removeAttribute('aria-disabled');
  TIPS.checkAll = {
    title: 'Check all', wide: true,
    lines: [allWhy || 'Everything once, side by side.', 'Left out: everything under a stopped or failed machine, and all project data.'],
    cmds: ['layerfs home doctor'].concat(plan.stores.length ? ['layerfs store doctor <store> ×' + plan.stores.length] : [], plan.sandboxes.length ? ['layerfs sandbox doctor <sandbox> ×' + plan.sandboxes.length] : [])
  };

  /* this install */
  const hv = view(W.by[HOME_KEY], 0);
  document.getElementById('home').innerHTML = '<div class="homeBox">' + rowHtml(hv) + (hv.open ? detailHtml(hv) : '') + '</div>';

  /* tabs: a mark counts only trouble that starts in that tab; its slot is always there */
  document.getElementById('tabs').innerHTML = TABS.map((d) => {
    const mine = things.filter((x) => x.k === d[2] || (d[0] === 'sandboxes' && x.k === 'workspace')).map((x) => stateOf(x));
    const count = things.filter((x) => x.k === d[2]).length;
    const nBad = mine.filter((o) => o.st === 'problem').length;
    const nWarn = mine.filter((o) => o.st === 'notice').length;
    const nRun = mine.filter((o) => o.st === 'run').length;
    const nStop = mine.filter((o) => o.st === 'nc' && o.why === 'stopped-self').length;
    const nCould = mine.filter((o) => o.st === 'nc' && o.why === 'could').length;
    const mark = nBad ? 'bad' : nRun ? 'run' : nWarn ? 'warn' : nStop || nCould ? 'nc' : '';
    const said = [nBad ? plural(nBad, 'problem') : '', nRun ? nRun + ' checking' : '', nWarn ? plural(nWarn, 'notice') : '', nStop ? nStop + ' stopped' : '', nCould ? nCould + ' could not be checked' : ''].filter(Boolean);
    const on = S.tab === d[0];
    return '<button type="button" class="tab" role="tab" id="tab-' + d[0] + '" data-tab="' + d[0] + '" aria-selected="' + on + '" aria-controls="panel" tabindex="' + (on ? 0 : -1) + '"'
      + tipFor('tab:' + d[0], said.length ? { title: d[1], lines: [said.join(' · ')] } : null) + '>'
      + '<span class="ico">' + TAB_ICON[d[0]]() + '</span><span class="tabLabel" data-text="' + d[1] + '"><span>' + d[1] + '</span></span><span class="tabCount">' + count + '</span>'
      + '<span class="dot">' + (mark ? mk(mark) : '') + '</span>' + (said.length ? '<span class="sr">, ' + esc(said.join(', ')) + '</span>' : '') + '</button>';
  }).join('');

  /* rows: each thing of this kind, with what is directly on it listed under it */
  const kind = TABS.find((d) => d[0] === S.tab)[2];
  const panel = document.getElementById('panel');
  panel.setAttribute('aria-labelledby', 'tab-' + S.tab);
  panel.innerHTML = things.filter((x) => x.k === kind).map((x) => '<div class="group">' + nodeHtml(x, 0) + '</div>').join('');

  if (focusId) {
    let el = document.querySelector('[data-fid="' + CSS.escape(focusId) + '"]');
    if (!el && focusId.indexOf(':') > 0) el = document.querySelector('[data-fid="' + CSS.escape('row:' + focusId.slice(focusId.indexOf(':') + 1)) + '"]');
    if (el && el !== document.activeElement) el.focus({ preventScroll: true });
  }
  quietFocus = false;
  if (keepTip) { const el = document.querySelector('[data-fid="' + CSS.escape(keepTip) + '"]'); if (el && TIPS[keepTip]) showTip(el); else hideTip(); }
  fades();
}

/* ------------------------------------------------------ tooltip, toast ---
   A tip hangs off a signal, a mark group or a button, never a whole row. It opens
   120 ms after the pointer or the keyboard arrives, and at once on a tap. It is placed
   below its anchor, so it never covers the rows above; beside it when there is no
   room below; above only when neither fits. */
const tipEl = document.getElementById('tip');
let tipFid = null; let tipTimer = null;
function showTip(el) {
  const fid = el.dataset.fid; const tip = TIPS[fid]; if (!tip) return;
  if (tipFid && tipFid !== fid) { const old = document.querySelector('[aria-describedby="tip"]'); if (old) old.removeAttribute('aria-describedby'); }
  tipFid = fid;
  tipEl.innerHTML = '<b>' + (tip.mark ? mk(tip.mark) : '') + esc(tip.title) + '</b>'
    + (tip.lines || []).filter(Boolean).map((l) => '<span class="l">' + esc(l) + '</span>').join('')
    + (tip.checks ? '<ul>' + tip.checks.map((c) => '<li>' + mk(c.r) + '<code>' + esc(checkName(c)) + '</code><i>' + esc(checkText(c)) + '</i></li>').join('') + '</ul>' : '')
    + (tip.cmds && tip.cmds.length ? '<pre>' + tip.cmds.map((l) => l.charAt(0) === '#' ? '<i>' + esc(l) + '</i>' : '<i>$ </i>' + esc(l)).join('\n') + '</pre>' : '');
  if (tip.wide || tip.checks || (tip.cmds && tip.cmds.length)) tipEl.dataset.wide = ''; else delete tipEl.dataset.wide;
  tipEl.dataset.on = '';
  el.setAttribute('aria-describedby', 'tip');
  tipEl.style.maxHeight = 'calc(100vh - 16px)';
  const r = el.getBoundingClientRect(); const w = tipEl.offsetWidth; const h = tipEl.offsetHeight;
  const vw = window.innerWidth; const vh = window.innerHeight; const gap = 6; const pad = 8;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  let left; let top; let side;
  if (r.bottom + gap + h <= vh - pad) { side = 'below'; top = r.bottom + gap; left = clamp(r.left, pad, vw - w - pad); }
  else if (r.right + gap + w <= vw - pad) { side = 'right'; left = r.right + gap; top = clamp(r.top, pad, vh - h - pad); }
  else if (r.left - gap - w >= pad) { side = 'left'; left = r.left - gap - w; top = clamp(r.top, pad, vh - h - pad); }
  else {
    const above = r.top - gap - pad; const below = vh - pad - r.bottom - gap;
    side = above >= below ? 'above' : 'below';
    tipEl.style.maxHeight = Math.max(0, side === 'above' ? above : below) + 'px';
    top = side === 'above' ? r.top - gap - tipEl.offsetHeight : r.bottom + gap;
    left = clamp(r.left, pad, vw - w - pad);
  }
  tipEl.dataset.side = side;
  tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
}
function showTipSoon(el) {
  const fid = el.dataset.fid;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => {                               // a render may have replaced the element meanwhile
    const now = document.querySelector('[data-fid="' + CSS.escape(fid) + '"]');
    if (now && (now.matches(':hover') || now === document.activeElement)) showTip(now);
  }, 120);
}
function hideTip() {
  clearTimeout(tipTimer); tipTimer = null; tipFid = null; delete tipEl.dataset.on;
  const old = document.querySelector('[aria-describedby="tip"]'); if (old) old.removeAttribute('aria-describedby');
}
function toast(text) {
  if (INSTANT) return;
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = text;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}
/* The tab bar scrolls sideways on a phone; a fade marks each edge that cuts tabs off. */
function fades() {
  const bar = document.getElementById('tabScroll');
  const max = bar.scrollWidth - bar.clientWidth;
  if (bar.scrollLeft > 6) bar.dataset.fadeL = ''; else delete bar.dataset.fadeL;
  if (bar.scrollLeft < max - 6) bar.dataset.fadeR = ''; else delete bar.dataset.fadeR;
}
/* A waiting row's root cause: open the path to its row and focus it. */
function goTo(key) {
  const x = W.by[key];
  if (!x) return toast('This row is no longer on record.');
  const shown = document.querySelector('[data-fid="' + CSS.escape('row:' + key) + '"]');
  if (!shown) {
    S.tab = TABS.find((d) => d[2] === (x.k === 'workspace' ? 'sandbox' : x.k))[0];
    if (x.k === 'workspace') S.open[x.parent] = true;
  }
  S.flash = key; focusNext = 'row:' + key;
  hideTip(); render();
  const el = document.querySelector('[data-fid="' + CSS.escape('row:' + key) + '"]');
  if (el) el.scrollIntoView({ block: 'nearest' });
  setTimeout(() => { if (S.flash === key) { S.flash = null; render(); } }, 1600);
}

/* -------------------------------------------------------------- events --- */
document.addEventListener('click', async (e) => {
  const link = e.target.closest('a[data-goto]');
  if (link) { e.preventDefault(); return goTo(link.dataset.goto); }
  const el = e.target.closest('button');
  if (!el) {
    const row = e.target.closest('.line');                 // the rest of a row opens it, as its name does
    if (row && !window.getSelection().toString()) { S.open[row.dataset.key] = !S.open[row.dataset.key]; hideTip(); render(); }
    else if (!e.target.closest('.tip')) hideTip();
    return;
  }
  if (el.classList.contains('sig') || el.classList.contains('marks') || el.classList.contains('chk')) return showTip(el);     // a tap opens the tip
  if (el.id === 'mockOpen') { resetWorld(); return render(); }
  if (el.id === 'mockSettle') return settle();
  if (el.getAttribute('aria-disabled') === 'true') return showTip(el);                          // says why, does nothing
  if (el.id === 'checkAll') { hideTip(); return checkAll(); }
  if (el.dataset.tab) { S.tab = el.dataset.tab; hideTip(); return render(); }
  const act = el.dataset.act; const key = el.dataset.key;
  if (act === 'copy') {
    if (!navigator.clipboard?.writeText) return toast('Clipboard unavailable. Select the command to copy it.');
    try { await navigator.clipboard.writeText(key); }
    catch (error) { return toast('Could not copy the command: ' + error.message); }
    el.textContent = 'Copied'; setTimeout(() => { if (el.isConnected) el.textContent = 'Copy'; }, 1400); return;
  }
  hideTip();
  if (act === 'toggle') { S.open[key] = !S.open[key]; return render(); }
  if (act === 'check') return runCheck(W.by[key]);
  if (act === 'full') return runFull(W.by[key]);
  if (act === 'fix') return runFix(W.by[key]);
  if (act === 'stop') { const c = running('full', key); if (c) cancel(c); }
});
const tipAnchor = (t) => { const el = t.closest && t.closest('[data-fid]'); return el && TIPS[el.dataset.fid] ? el : null; };
document.addEventListener('mouseover', (e) => { const el = tipAnchor(e.target); if (el && el.dataset.fid !== tipFid) showTipSoon(el); });
// Allow the pointer to cross the gap into a scrollable tip.
function leaveTip() { clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 180); }
tipEl.addEventListener('mouseenter', () => clearTimeout(tipTimer));
tipEl.addEventListener('mouseleave', leaveTip);
document.addEventListener('mouseout', (e) => { const el = tipAnchor(e.target); if (el && !el.contains(e.relatedTarget)) leaveTip(); });
document.addEventListener('focusin', (e) => { if (quietFocus) return; const el = tipAnchor(e.target); if (el && el.matches(':focus-visible')) showTipSoon(el); });
document.addEventListener('focusout', () => { if (!quietFocus) hideTip(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return hideTip();
  const t = e.target;
  if (t.closest && t.closest('[role="tab"]')) {             // the tab bar: arrows, Home, End
    const order = TABS.map((d) => d[0]); let i = order.indexOf(S.tab);
    if (e.key === 'ArrowRight') i = (i + 1) % order.length;
    else if (e.key === 'ArrowLeft') i = (i + order.length - 1) % order.length;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = order.length - 1;
    else return;
    e.preventDefault(); S.tab = order[i]; hideTip(); render();
    const el = document.getElementById('tab-' + S.tab); el.focus(); el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    const bar = document.getElementById('tabScroll');
    if (i === 0) bar.scrollLeft = 0; else if (i === order.length - 1) bar.scrollLeft = bar.scrollWidth;
    fades();
    return;
  }
  const row = t.classList && t.classList.contains('rowBtn') && t.closest('#panel') ? t : null;
  if (!row) return;                                          // the tree: up, down, right opens, left closes
  const rows = Array.from(document.querySelectorAll('#panel .rowBtn')); const i = rows.indexOf(row);
  const x = W.by[row.dataset.key]; const open = !!S.open[x.key];
  const to = (el) => { if (el) { el.focus(); el.scrollIntoView({ block: 'nearest' }); } };
  const again = (key) => document.querySelector('#panel [data-fid="' + CSS.escape('row:' + key) + '"]');
  if (e.key === 'ArrowDown') to(rows[i + 1]);
  else if (e.key === 'ArrowUp') to(rows[i - 1]);
  else if (e.key === 'Home') to(rows[0]);
  else if (e.key === 'End') to(rows[rows.length - 1]);
  else if (e.key === 'ArrowRight') { if (!open) { S.open[x.key] = true; render(); } else if (kidsOf(x).length) to(rows[i + 1]); }
  else if (e.key === 'ArrowLeft') { if (open) { S.open[x.key] = false; render(); } else if (x.parent && again(x.parent)) to(again(x.parent)); }
  else return;
  e.preventDefault();
});
document.getElementById('tabScroll').addEventListener('scroll', fades);
window.addEventListener('resize', () => { hideTip(); fades(); });
window.addEventListener('scroll', (e) => { if (e.target !== tipEl && e.target !== document.getElementById('tabScroll')) hideTip(); }, true);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto') setTheme('auto'); });

/* MOCK ONLY: the scenario strip */
const scSel = document.getElementById('scenario');
scSel.innerHTML = SCENARIOS.map((s) => '<option value="' + s.id + '">' + esc(s.label) + '</option>').join('');
const hint = () => { document.getElementById('mockHint').textContent = SCENARIOS.find((s) => s.id === S.sc).hint; };
scSel.addEventListener('change', () => { setScenario(scSel.value); hint(); });
document.getElementById('theme').addEventListener('change', (e) => setTheme(e.target.value));

setTheme('auto');
setScenario('mixed'); hint();
</script>
</body>
