[package]
name = "layerfs-g5-h11-benchmark"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
build = "build.rs"

[workspace]

[dependencies]
blake3 = { version = "=1.8.5", default-features = false }
layerfs-core = { path = "../../../../../../crates/layerfs-core" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["cache", "blob", "hooks"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"






