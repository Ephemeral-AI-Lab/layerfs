# Nightly lane: the tests the fast lane leaves out. Report only; never a
# required check. Selection: core/tools/ci_tests.py.
#  - slow:  binaries that take 5 s or more to run, plus the "heavy" ones that
#           take 5 s or more of build CPU (left out of the push job), on the
#           runner
#  - mount: Linux-only layerfs-daemon targets that mount FUSE. Each binary runs
#           in its own fresh container with /dev/fuse and SYS_ADMIN, as the
#           existing native proofs do: forced_unavailable needs fusectl absent,
#           and fp2_negotiation_flags needs one test thread.
name: nightly

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_OFFLINE: "0"

jobs:
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.85.1 --profile minimal
      - uses: taiki-e/install-action@v2.87.24
        with:
          tool: cargo-nextest@0.9.146
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: core -> target
      - name: Build test binaries
        run: make build-test-nightly
      - name: Run slow and heavy tests (whole run capped at 120 s)
        run: make run-test-nightly

  mount:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.85.1 --profile minimal
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: core -> target
      - name: Build mount test binaries
        run: make build-mount-tests MOUNT_BUILD_JSON="$RUNNER_TEMP/build.json" MOUNT_EXECUTABLES="$RUNNER_TEMP/mount.tsv"
      - name: Prepare FUSE and the test image
        run: |
          sudo modprobe fuse
          ls -l /dev/fuse
          # Same Ubuntu release as the runner, so the host-built binaries' glibc matches.
          printf '%s\n' 'FROM ubuntu:24.04' \
            'RUN apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*' \
            | docker build -t layerfs-mount-test -
      - name: Run each mount binary in its own container (each capped at 120 s)
        run: |
          status=0
          while IFS=$'\t' read -r dir exe; do
            name="$(basename "$exe")"
            echo "::group::$name"
            # A fresh /tmp on the runner's ext4 disk, not the container overlay.
            scratch="$RUNNER_TEMP/tmp-$name"
            mkdir -p "$scratch"
            chmod 1777 "$scratch"  # like /tmp: the tests' non-root scripts write here
            if ! docker run --rm --device /dev/fuse --cap-add SYS_ADMIN \
                --security-opt apparmor=unconfined \
                -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$scratch:/tmp" -w "$dir" \
                layerfs-mount-test timeout 120 "$exe" --test-threads=1; then
              echo "::error title=mount test failed::$name"
              status=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/mount.tsv"
          exit "$status"
