# Fast lane: runs after a push and reports. It is never a required check and
# never blocks a push or merge; agents do not wait for it (AGENTS.md §4).
# Slow and FUSE mount tests run in nightly.yml. Selection: core/tools/ci_tests.py.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "sdk/js/native/**"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
      - "!core/docs/**"
  pull_request:
    paths:
      - "core/**"
      - "sdk/js/native/**"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
      - "!core/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # CI needs no debugger: smaller objects, much shorter links for ~345 test binaries.
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  checks:
    name: fmt and guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - run: cargo +1.85.1 fmt --manifest-path core/Cargo.toml --all -- --check
      - run: python3 -B core/tools/check_product_boundary.py
      - run: python3 -B core/tools/check_fuser_integrity.py
      - run: python3 -B -m unittest discover -s core/tools -p 'test_*.py'

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.85.1 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: core -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.85.1 clippy --manifest-path core/Cargo.toml --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.85.1 --profile minimal
      - uses: taiki-e/install-action@v2.87.24
        with:
          tool: cargo-nextest@0.9.146
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: core -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Build first so compile time is never counted against the test ceiling.
      # Examples are left out: Clippy already checks that they compile.
      - name: Build test binaries
        run: cargo +1.85.1 test --manifest-path core/Cargo.toml --locked --lib --bins --tests --no-run
      - name: Run fast tests (whole run capped at 120 s)
        run: |
          filter="$(python3 -B core/tools/ci_tests.py filter fast)"
          timeout 120 cargo +1.85.1 nextest run --manifest-path core/Cargo.toml --locked \
            --lib --bins --tests --profile ci -E "$filter"
