# Fast lane: runs after a push and reports. It is never a required check and
# never blocks a push or merge; agents do not wait for it (AGENTS.md §4).
# Slow and FUSE mount tests run in nightly.yml. Selection: core/tools/ci_tests.py.
# The JavaScript SDK (sdk/js, package layerfs-node) is left out of CI (owner,
# 2026-10-23): no path trigger, excluded from Clippy and tests, skipped by the guard.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
      - "!core/docs/**"
  pull_request:
    paths:
      - "core/**"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
      - "!core/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # CI needs no debugger: smaller objects, much shorter links for ~345 test binaries.
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  checks:
    name: fmt and guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - run: cargo +1.85.1 fmt --manifest-path core/Cargo.toml --all -- --check
      # Each check reports even when an earlier one failed.
      - if: ${{ !cancelled() }}
        run: python3 -B core/tools/check_product_boundary.py --skip-sdk
      - if: ${{ !cancelled() }}
        run: python3 -B core/tools/check_fuser_integrity.py
      - if: ${{ !cancelled() }}
        run: python3 -B -m unittest discover -s core/tools -p 'test_*.py'

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.85.1 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: core -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.85.1 clippy --manifest-path core/Cargo.toml --locked --workspace --exclude layerfs-node --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Link the ~345 test binaries with mold instead of GNU ld. Scoped to this
      # target, so the repository's aarch64 rustflags (.cargo/config.toml) stay.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.85.1 --profile minimal
      - name: Install mold
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mold
          mold --version
      - uses: taiki-e/install-action@v2.87.24
        with:
          tool: cargo-nextest@0.9.146
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: core -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Build first so compile time is never counted against the test ceiling.
      # Examples are left out: Clippy already checks that they compile.
      # --timings writes where build time goes (compile vs link, per unit).
      - name: Build test binaries
        run: |
          cargo +1.85.1 test --manifest-path core/Cargo.toml --locked \
            --workspace --exclude layerfs-node --lib --bins --tests --no-run --timings
      - name: Upload build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-build-timings
          path: core/target/cargo-timings/cargo-timing.html
          retention-days: 14
      - name: Run fast tests (whole run capped at 120 s)
        run: |
          filter="$(python3 -B core/tools/ci_tests.py filter fast)"
          timeout 120 cargo +1.85.1 nextest run --manifest-path core/Cargo.toml --locked \
            --workspace --exclude layerfs-node --lib --bins --tests --profile ci -E "$filter"
