[package]
name = "layerfs-sandbox-backend"
description = "Ordinary local Engine commands, streams and exact runtime status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sha2 = "=0.11.0"
# The local process identity (`LocalProcess`, `/proc` and `proc_pidinfo`
# facts), shared with the home below both (layerfs-project#112).
layerfs-bridge = { path = "../../../engine/crates/layerfs-bridge", default-features = false }
nix = { version = "=0.31.3", features = [
    "poll",
    "socket",
    "fs",
    "signal",
    "mount",
    "user",
    "sched",
    "process",
    # readdir on a descriptor, for inspection listings (layerfs-project#178)
    "dir",
] }

# `statx` with `STATX_MNT_ID`, which nix does not wrap: every `stat` of an
# inspection read on Linux (layerfs-project#178 isolation rule 5, security
# rule 1). The version the lockfile already holds.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }
