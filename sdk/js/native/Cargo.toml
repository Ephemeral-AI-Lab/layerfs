[package]
name = "layerfs-node"
description = "Node binding for the LayerFS JavaScript SDK: Store calls in-process (layerfs-store-service), Sandbox calls over layerfs-api"
publish = false
workspace = "../../../core"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
layerfs-bridge = { path = "../../../core/crates/layerfs-bridge" }
layerfs-session = { path = "../../session" }
napi = "=2.16.17"
napi-derive = "=2.16.13"

[build-dependencies]
napi-build = "=2.1.6"
