[workspace]
resolver = "2"
members = [
    "crates/layerfs-core",
    "crates/layerfs-storage-core",
    "crates/layerfs-branch-store",
    "crates/layerfs-stack-store",
    "crates/layerfs-layer-store",
    "crates/layerfs-sdk",
    "crates/layerfs-workspace",
    "crates/layerfs-mount",
    "crates/layerfs-materialization",
    "tools/layerfs-eval",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
blake3 = { version = "=1.8.5", default-features = false }
rusqlite = { version = "=0.40.2", features = ["cache", "hooks"] }
ed25519-dalek = "=2.2.0"
