[workspace]
resolver = "2"
members = [
    "crates/layerfs-core",
    "crates/layerfs-storage",
    "crates/layerfs-working-store",
    "crates/layerfs-durable-store",
    "crates/layerfs-sync",
    "crates/layerfs-service",
    "crates/layerfs-workspace",
    "crates/layerfs-materialization",
    "crates/layerfs-mount",
    "crates/layerfs-sdk",
    "tools/layerfs-eval",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
blake3 = { version = "=1.8.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
