# LayerFS workspace: core algorithms, engine composition, machine/network
# control crates and public API.

[workspace]
resolver = "2"
members = [
    "core/crates/*",
    "engine/crates/*",
    "control/crates/*",
    "api/crates/*",
]

[workspace.package]
edition = "2021"
version = "2.0.0"
rust-version = "1.85"
license = "MIT"

# Keep the large boundary fixtures cheap without removing cases or assertions.
# Product dev/release profiles and test debug assertions stay unchanged.
[profile.test]
opt-level = 1

[profile.test.package.zstd-sys]
opt-level = 3
