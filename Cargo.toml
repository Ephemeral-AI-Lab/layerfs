[workspace]
resolver = "2"
members = [
    "crates/layerfs-content",
    "crates/layerfs-daemon",
    "crates/layerfs-layerstack-store",
    "crates/layerfs-sdk",
    "crates/layerfs-workspace",
    "crates/layerfs-fuse",
    "crates/layerfs-materialization",
    "crates/layerfs-monitor",
    "crates/layerfs-cli",
    "tools/layerfs-eval",
    "benchmark/fs-bench-pro",
]

[workspace.package]
edition = "2021"
version = "0.1.1"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
blake3 = { version = "=1.8.5", default-features = false }
rusqlite = { version = "=0.40.2", features = ["cache", "hooks", "trace"] }
clap = { version = "=4.5.48", features = ["derive"] }
