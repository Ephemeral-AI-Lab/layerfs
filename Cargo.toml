[workspace]
resolver = "2"
members = [
    "crates/layerfs-content",
    "crates/layerfs-daemon",
    "crates/layerfs-layerstack-store",
    "crates/layerfs-sdk",
    "crates/layerfs-workspace",
    "crates/layerfs-workspace-core",
    "crates/layerfs-fuse",
    "crates/layerfs-materialization",
    "crates/layerfs-monitor",
    "crates/layerfs-cli",
    "tools/layerfs-eval",
    "benchmark/fs-bench-pro",
]
# The replacement product workspace under core/ has its own members, lockfile
# and target directory; it is not part of this reference workspace.
exclude = ["core"]

[workspace.package]
edition = "2021"
version = "0.1.6"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
blake3 = { version = "=1.8.5", default-features = false }
rusqlite = { version = "=0.40.2", features = ["cache", "hooks", "trace", "limits", "blob"] }
clap = { version = "=4.5.48", features = ["derive"] }
