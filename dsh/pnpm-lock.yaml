lockfileVersion: '9.0'

settings:
  autoInstallPeers: false
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/client:
    dependencies:
      '@dsh-layerfs/model':
        specifier: workspace:*
        version: link:../model
      '@dsh-layerfs/view':
        specifier: workspace:*
        version: link:../view

  packages/dsh-layerfs:
    dependencies:
      '@dsh-layerfs/client':
        specifier: workspace:*
        version: link:../client
      '@dsh-layerfs/host':
        specifier: workspace:*
        version: link:../host

  packages/dsh-layerfs-demo:
    dependencies:
      '@dsh-layerfs/mock':
        specifier: workspace:*
        version: link:../mock

  packages/host:
    dependencies:
      '@dsh-layerfs/model':
        specifier: workspace:*
        version: link:../model
      '@layerfs/port':
        specifier: link:../../../port
        version: link:../../../port
      '@layerfs/sdk':
        specifier: link:../../../sdk/js
        version: link:../../../sdk/js

  packages/mock: {}

  packages/model: {}

  packages/view:
    dependencies:
      '@dsh-layerfs/model':
        specifier: workspace:*
        version: link:../model
