[package]
name = "layerfs-api"
description = "The SDK's public surface: the call table, its call machinery and its one dispatcher over the control crates, whose public paths it re-exports for the front ends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerfs-protocol = { path = "../../../engine/crates/layerfs-protocol" }
# The management library every call runs in (#536).
layerfs-inspect = { path = "../../../control/crates/layerfs-inspect" }
layerfs-home = { path = "../../../control/crates/layerfs-home" }
layerfs-machine = { path = "../../../control/crates/layerfs-machine" }
layerfs-store = { path = "../../../control/crates/layerfs-store" }
# Also the permanent platform restrictions the call machinery checks before
# any effect (`calls/platform_policy.rs`), in every build (layerfs-project#107).
layerfs-sandbox = { path = "../../../control/crates/layerfs-sandbox" }
# The Workspace calls (#828).
layerfs-workspace = { path = "../../../control/crates/layerfs-workspace" }
# The guest worker's server (`worker/`, #828): its Store operations run under
# the caller's place view (the Store service's admission).
layerfs-store-service = { path = "../../../engine/crates/layerfs-store-service" }
# The guest worker's fault switches name a failed thread start by its errno
# (`worker/fault.rs`); layerfs-control had it before #828.
libc = "=0.2.189"

[features]
# The worker's fault switches and shorter waits, for its tests only
# (layerfs-project#177, #179 E): `worker::fault` and the host worker's write
# faults in layerfs-store. Never a default feature; the boundary guard checks.
worker-fault = ["layerfs-store/worker-fault"]
# https:// remotes: Cloudflare R2, MinIO behind TLS. Off by default; the
# sealed Linux build the worker runs turns it on.
tls = ["layerfs-inspect/tls"]
# The machine calls (2.0, #533): host builds only. The guest worker is built
# without it, so no machine adapter runs inside a machine.
machine = ["layerfs-inspect/machine", "layerfs-machine/machine", "layerfs-sandbox/machine", "layerfs-store/machine", "layerfs-workspace/machine"]

[dev-dependencies]
nix = { version = "=0.31.3", features = ["fs", "user", "process"] }
# store-service's SDK support (remote_store) binds private Workspaces.
layerfs-overlay = { path = "../../../engine/crates/layerfs-overlay" }
# The tests drive these crates directly beside the call surface.
layerfs-content = { path = "../../../core/crates/layerfs-content" }
layerfs-history = { path = "../../../core/crates/layerfs-history" }
layerfs-persistence = { path = "../../../engine/crates/layerfs-persistence" }
layerfs-storage = { path = "../../../core/crates/layerfs-storage" }
layerfs-telemetry = { path = "../../../core/crates/layerfs-telemetry" }
layerfs-project = { path = "../../../engine/crates/layerfs-project" }
layerfs-store-service = { path = "../../../engine/crates/layerfs-store-service" }
# project_doctor_full damages a throwaway Store's object table to check the
# data walk's finding.
rusqlite = { version = "=0.40.2", features = ["cache", "limits", "blob"] }
# project_doctor_full damages its own PostgreSQL Store database.
postgres = "=0.19.14"
# the store upgrade tests (#804) compare file contents with a fixture
# manifest's sha256
sha2 = "=0.11.0"
layerfs-os = { path = "../../../engine/crates/layerfs-os" }

