[package]
name = "layerfs-api"
description = "The SDK's public surface: the call table and its one dispatcher over layerfs-control, whose public paths it re-exports for the front ends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerfs-bridge = { path = "../../../engine/crates/layerfs-bridge" }
# The management library every call runs in (#536).
layerfs-control = { path = "../layerfs-control" }

[features]
# PostgreSQL Stores (#506, #533): open, attach, create and Init.
# Off by default; the sealed Linux build the worker runs turns it on.
postgresql = ["layerfs-control/postgresql"]
# https:// remotes: Cloudflare R2, MinIO behind TLS. Off by default; the
# sealed Linux build the worker runs turns it on.
tls = ["layerfs-control/tls"]
# The machine calls (2.0, #533): host builds only. The guest worker is built
# without it, so no machine adapter runs inside a machine.
machine = ["layerfs-control/machine"]

[dev-dependencies]
nix = { version = "=0.31.3", features = ["fs", "user", "process"] }
# store-service's SDK support (remote_store) binds private Workspaces.
layerfs-overlay = { path = "../../../engine/crates/layerfs-overlay" }
layerfs-workspace = { path = "../../../engine/crates/layerfs-workspace" }
# The tests drive these crates directly beside the call surface.
layerfs-content = { path = "../../../core/crates/layerfs-content" }
layerfs-history = { path = "../../../core/crates/layerfs-history" }
layerfs-persistence = { path = "../../../engine/crates/layerfs-persistence" }
layerfs-storage = { path = "../../../core/crates/layerfs-storage" }
layerfs-telemetry = { path = "../../../core/crates/layerfs-telemetry" }
layerfs-project = { path = "../../../engine/crates/layerfs-project" }
layerfs-sandbox = { path = "../../../connect/crates/layerfs-sandbox" }
layerfs-machine = { path = "../../../connect/crates/layerfs-machine" }
layerfs-store-service = { path = "../../../engine/crates/layerfs-store-service" }
layerfs-store-backup = { path = "../../../connect/crates/layerfs-store-backup" }
