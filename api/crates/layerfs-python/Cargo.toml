[package]
name = "layerfs-python"
description = "Python front end of the layerfs package (#533 step 16): the library's one call and its call table, through PyO3"
publish = false
workspace = "../../.."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["machine"]
machine = ["layerfs-api/machine"]
postgresql = ["layerfs-api/postgresql"]
tls = ["layerfs-api/tls"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["abi3-py310", "extension-module"] }
layerfs-api = { path = "../layerfs-api" }
layerfs-bridge = { path = "../../../engine/crates/layerfs-bridge" }

[build-dependencies]
# `-undefined dynamic_lookup` on macOS, so a plain cargo build links the
# extension module as maturin does.
pyo3-build-config = "=0.30.1"
