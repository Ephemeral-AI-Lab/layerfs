[package]
name = "layerfs-cli"
description = "The `layerfs` command (#533 step 15): the library's call table as a shell, and `layerfs worker` inside a machine"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "layerfs_cli"
path = "src/lib.rs"

[[bin]]
name = "layerfs"
path = "src/main.rs"

[features]
default = ["machine"]
# The machine calls run on a host. The guest bundle's `layerfs worker` is
# built with --no-default-features, so no machine adapter runs in a machine.
machine = ["layerfs-api/machine"]
tls = ["layerfs-api/tls"]

[dependencies]
layerfs-api = { path = "../layerfs-api" }
layerfs-protocol = { path = "../../../engine/crates/layerfs-protocol" }
# `store upgrade` blocks SIGINT and SIGTERM and waits for them on a thread
# (#804 §6), in safe code
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
layerfs-home = { path = "../../../control/crates/layerfs-home" }
layerfs-sandbox = { path = "../../../control/crates/layerfs-sandbox" }
layerfs-store = { path = "../../../control/crates/layerfs-store" }
layerfs-os = { path = "../../../engine/crates/layerfs-os" }

[dev-dependencies]
# The host worker's PostgreSQL proof (#819 P-B) counts a test role's
# backends and changes its password: the pinned client the persistence
# crate already locks, no new version.
postgres = "=0.19.14"
layerfs-os = { path = "../../../engine/crates/layerfs-os" }

[[test]]
name = "exec_cancel_forwarded"
path = "tests/standalone/exec_cancel_forwarded.rs"

[[test]]
name = "disabled_platforms"
path = "tests/standalone/disabled_platforms.rs"

[[test]]
name = "machine_unreadable_record"
path = "tests/standalone/machine_unreadable_record.rs"

[[test]]
name = "worker"
path = "tests/standalone/worker.rs"
