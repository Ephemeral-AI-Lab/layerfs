[build-system]
requires = ["maturin>=1.9.6,<2.0"]
build-backend = "maturin"

[project]
name = "layerfs"
version = "2.0.0"
description = "LayerFS for Python: the ten families of the one call table, each a call into the native library (#533)"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
manifest-path = "../crates/layerfs-python/Cargo.toml"
module-name = "layerfs._native"
python-source = "src"
features = ["pyo3/extension-module"]
