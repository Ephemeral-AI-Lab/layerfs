# Ruff formats the maintained Python tools. .github/workflows/format.yml reports
# drift after a push; nothing runs before one. From the repository root, with
# the pinned version:
#   pipx run --spec ruff==0.17.2 ruff format
#   pipx run --spec ruff==0.17.2 ruff check
# Docs, evidence and engine/vendor are outside `include` and stay as recorded.
include = ["tools/**/*.py"]
target-version = "py311" # tomllib
line-length = 120
