  <g fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 48 L56 62 L42 76"/>
    <path d="M62 76 H88"/>
  </g>
  <!-- parallel-verify accent: tiny dual ticks -->
  <g fill="none" stroke="#F3C96A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <path d="M92 42 l5 5 9-11"/>
    <path d="M92 54 l5 5 9-11"/>
  </g>
