<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Codex Parallel Verify for LayerFS">
  <defs>
    <linearGradient id="blob" x1="28" y1="22" x2="100" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4BBFF"/>
      <stop offset=".45" stop-color="#7A9DFF"/>
      <stop offset="1" stop-color="#3941FF"/>
    </linearGradient>
    <linearGradient id="layerTop" x1="40" y1="36" x2="88" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDE9FF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#A8B8FF" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="layerMid" x1="36" y1="52" x2="92" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4CCFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#6B8CFF" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="layerBot" x1="40" y1="68" x2="88" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B1A7FF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#3941FF" stop-opacity=".65"/>
    </linearGradient>
  </defs>
  <!-- soft dark tile -->
  <rect width="128" height="128" rx="28" fill="#12132A"/>
  <!-- organic cloud silhouette (original path; Codex-inspired soft blob, not official path) -->
  <path fill="url(#blob)" d="
    M64 22c12.5 0 22.5 5.8 28.8 14.2 6.8-2.4 14.6-1.2 20.2 4.1 6.2 5.9 7.8 14.6 4.6 22.2
    5.1 4.8 7.6 11.8 6.2 19-2.1 10.8-11.2 18.2-22.4 19.2-2.9 7.8-9.6 13.6-18.2 15.4-7.4 1.5-15-.6-20.4-5.4
    -4.6 3.6-10.4 5.2-16.4 4.4-9.6-1.3-17.2-8-19.4-17.2-6.2-1.6-11.4-5.8-14-11.6-3.6-8.1-1.8-17.4 4.6-23.4
    -1.2-4.2-1.2-8.8.4-13.1 3.4-9.2 11.8-15.2 21.6-15.8C46.2 25.2 54.4 22 64 22z"/>
  <!-- LayerFS hint: three stacked soft bands inside the blob -->
  <ellipse cx="64" cy="46" rx="30" ry="9" fill="url(#layerTop)"/>
  <ellipse cx="64" cy="60" rx="34" ry="10" fill="url(#layerMid)"/>
  <ellipse cx="64" cy="74" rx="30" ry="9" fill="url(#layerBot)"/>
