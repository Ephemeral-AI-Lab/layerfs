[package]
name = "layerfs-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false
autotests = false

[features]
default = []
# Feature-gated qualification bridge for external integration targets.
# FastCDC is the selected baseline; SeqCDC remains deferred until L1 is complete.
operation-polymorphism = []

[lib]
name = "layerfs_storage"
path = "src/lib.rs"

[dependencies]
# Frozen L1 identity adapter: unkeyed BLAKE3-256 only, with the exact audited
# version and no optional/default features.
blake3.workspace = true

[target.'cfg(unix)'.dependencies]
# POSIX process CPU clocks for the portable qualification adapter. Non-Unix
# targets report the metric as unavailable rather than inventing a substitute.
libc = { version = "=0.2.189", default-features = false }

[[test]]
name = "l0_architecture"
path = "tests/l0_architecture.rs"

[[test]]
name = "operation_create"
path = "tests/operation_create.rs"

[[test]]
name = "cas_admission"
path = "tests/cas_admission.rs"

[[test]]
name = "operation_lifecycle"
path = "tests/operation_lifecycle.rs"

[[test]]
name = "operation_concurrency"
path = "tests/operation_concurrency.rs"

[[test]]
name = "operation_faults"
path = "tests/operation_faults.rs"

[[test]]
name = "operation_mutation"
path = "tests/operation_mutation.rs"

[[test]]
name = "operation_read"
path = "tests/operation_read.rs"

[[test]]
name = "cow_locality"
path = "tests/cow_locality.rs"
