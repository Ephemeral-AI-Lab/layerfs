[package]
name = "layerfs-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false
autotests = false

[features]
default = []
# Closed C3 CDC polymorphism and its externally supervised qualification
# harness. FastCDC is the selected baseline; SeqCDC is the explicit alternate.
operation-polymorphism = []

[lib]
name = "layerfs_storage"
path = "src/lib.rs"

[dependencies]
# Frozen L1 identity adapter: unkeyed BLAKE3-256 only, with the exact audited
# version and no optional/default features.
blake3.workspace = true

[target.'cfg(unix)'.dependencies]
# POSIX process CPU clocks for the portable qualification adapter. Non-Unix
# targets report the metric as unavailable rather than inventing a substitute.
libc = { version = "=0.2.189", default-features = false }

[[test]]
name = "l0_architecture"
path = "tests/l0_architecture.rs"

[[test]]
name = "l0_codec_vectors"
path = "tests/l0_codec_vectors.rs"

[[test]]
name = "l0_identity_vectors"
path = "tests/l0_identity_vectors.rs"

[[test]]
name = "l1_cdc"
path = "tests/l1_cdc.rs"

[[test]]
name = "l1_identity"
path = "tests/l1_identity.rs"

[[test]]
name = "l1_object"
path = "tests/l1_object.rs"

[[test]]
name = "l1_profiles"
path = "tests/l1_profiles.rs"

[[test]]
name = "c3_seqcdc_compare"
path = "tests/c3_seqcdc_compare.rs"
required-features = ["operation-polymorphism"]
