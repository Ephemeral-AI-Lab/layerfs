[package]
name = "layerfs-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["host-fuse"]
host-fuse = ["layerfs-fuse/host"]

[dependencies]
layerfs-branch-store = { path = "../layerfs-branch-store" }
layerfs-content = { path = "../layerfs-content" }
layerfs-fuse = { path = "../layerfs-fuse", default-features = false }
layerfs-materialization = { path = "../layerfs-materialization" }
layerfs-storage = { path = "../layerfs-storage" }

[lib]
path = "src/lib.rs"

[dev-dependencies]
layerfs-layerstack-store = { path = "../layerfs-layerstack-store" }
rusqlite.workspace = true
