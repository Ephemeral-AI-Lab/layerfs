[package]
name = "layerfs-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["host-fuse"]
host-fuse = ["layerfs-fuse/host"]
test-instrumentation = ["layerfs-layerstack-store/test-instrumentation", "layerfs-fuse/test-instrumentation"]

[dependencies]
layerfs-workspace-core = { path = "../layerfs-workspace-core" }
layerfs-content = { path = "../layerfs-content" }
layerfs-daemon = { path = "../layerfs-daemon" }
layerfs-fuse = { path = "../layerfs-fuse", default-features = false, features = ["live"] }
layerfs-layerstack-store = { path = "../layerfs-layerstack-store" }
layerfs-materialization = { path = "../layerfs-materialization" }

[lib]
path = "src/lib.rs"

[dev-dependencies]
rusqlite.workspace = true
