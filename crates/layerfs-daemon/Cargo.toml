[package]
name = "layerfs-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
nix = { version = "=0.29.0", default-features = false, features = ["fs", "mount", "process", "resource", "signal", "socket", "user"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "layerfs-daemon"
path = "src/main.rs"
