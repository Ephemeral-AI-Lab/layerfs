[package]
name = "layerfs-fuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["host"]
host = ["dep:fuser", "live"]
proxy = ["dep:fuser", "live"]
live = ["dep:tokio"]
# Verification-only surface. A released daemon is built without it, so it can
# neither arm nor consume an injected append failure; the benchmark image
# builds `layerfs-fuse` with this feature for the reliability proofs.
test-instrumentation = []

[dependencies]
tokio = { version = "=1.48.0", default-features = false, features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros"], optional = true }
layerfs-workspace-core = { path = "../layerfs-workspace-core" }
fuser = { version = "=0.18.0", default-features = false, optional = true }
layerfs-content = { path = "../layerfs-content" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.29.0", default-features = false, features = ["fs"] }
