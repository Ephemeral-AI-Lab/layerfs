[package]
name = "layerfs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
clap.workspace = true
layerfs-sdk = { path = "../layerfs-sdk" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=0.38.44", features = ["net", "process"] }

[target.'cfg(any(target_vendor = "apple", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
nix = { version = "=0.29.0", default-features = false, features = ["socket", "user"] }

[[bin]]
name = "layerfs"
path = "src/bin/layerfs.rs"
